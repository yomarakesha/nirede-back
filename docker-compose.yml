services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirede
      POSTGRES_PASSWORD: nirede
      POSTGRES_DB: nirede
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirede"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nirede:nirede@db:5432/nirede
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
